<svg viewBox="0 0 900 660" xmlns="http://www.w3.org/2000/svg" font-family="Fira Code, monospace">

  <defs>
    <linearGradient id="bgfade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="100%" stop-color="#020a04"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="frame">
      <rect x="0" y="0" width="900" height="660" rx="6"/>
    </clipPath>
    <clipPath id="mainpanel">
      <rect x="0" y="0" width="900" height="500"/>
    </clipPath>
    <clipPath id="hexpanel">
      <rect x="0" y="506" width="900" height="154"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="900" height="660" fill="url(#bgfade)"/>

    <!-- ================= CRT POWER-ON BOOT ================= -->
    <!-- master boot cycle: 14s. Flash 0-0.6s, BIOS lines 0.6-1.7s, dashboard fades in after -->
    <rect x="0" y="0" width="900" height="660" fill="#eafff0">
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.01;0.03;0.09;1" dur="14s" repeatCount="indefinite"/>
