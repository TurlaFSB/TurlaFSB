    <rect x="0" y="326" width="900" height="6" fill="#eafff0">
      <animate attributeName="width" values="0;900;900;0;0" keyTimes="0;0.045;0.075;0.09;1" dur="14s" repeatCount="indefinite"/>
      <animate attributeName="x" values="450;0;0;450;450" keyTimes="0;0.045;0.075;0.09;1" dur="14s" repeatCount="indefinite"/>
    </rect>

    <g font-size="13" fill="#00ff41" font-family="Fira Code, monospace">
